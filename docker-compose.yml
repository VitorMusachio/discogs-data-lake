x-airflow-common: &airflow-common
  build: ./airflow
  image: discogs-airflow:2.9.3
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow/src
    PIPELINE_CONFIG: /opt/airflow/config/tracking.yml
    PIPELINES_DIR: /opt/airflow/pipelines
    SQL_DIR: /opt/airflow/sql
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./pipelines:/opt/airflow/pipelines
    - ./tests:/opt/airflow/tests
    - ./pytest.ini:/opt/airflow/pytest.ini:ro
    - ./config:/opt/airflow/config
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:3.85
    env_file: .env
    # Single server (master + volume + filer) with the S3 API on port 8333.
    # The .env credentials become the S3 identity with admin permissions.
    entrypoint: /bin/sh
    command:
      - -c
      - |
        printf '{"identities": [{"name": "lake", "credentials": [{"accessKey": "%s", "secretKey": "%s"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}' "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" > /etc/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # file browser (filer)
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  hive-metastore:
    build: ./hive
    image: discogs-hive-metastore:4.0.0
    env_file: .env
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
    volumes:
      - ./hive/conf:/hive_custom_conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  trino:
    image: trinodb/trino:460
    env_file: .env
    mem_limit: 2g  # Trino's JVM takes 80% of available memory; without a limit it takes over the machine
    ports:
      - "8081:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      - hive-metastore
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.50.36
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - trino
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        python -c "import boto3, os; c = boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT'], aws_access_key_id=os.environ['S3_ACCESS_KEY'], aws_secret_access_key=os.environ['S3_SECRET_KEY'], region_name='us-east-1'); b = os.environ['LAKE_BUCKET']; b in [x['Name'] for x in c.list_buckets()['Buckets']] or c.create_bucket(Bucket=b)" &&
        airflow users create --role Admin --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  seaweedfs-data:
  metabase-data:
  airflow-logs:
