[project]
name = "discogs-data-lake"
version = "2.0.0"
description = "Local lakehouse with Discogs API data: declarative Airflow DAGs, Spark SQL layers, Trino."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["discogs_pipeline"]
known-local-folder = ["fakes"]
